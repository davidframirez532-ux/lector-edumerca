<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<title>Edumerca · Consulte su precio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --verde:#0f3d2e; --verde2:#16573f; --verde3:#1f6b4f; --amarillo:#ffd23f;
    --papel:#fbfaf5; --tinta:#1b1b1b; --gris:#6b7069; --rojo:#c0392b;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:var(--verde); color:var(--papel);
    font-family:"Barlow",system-ui,sans-serif;
    overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit}
  .pantalla{position:fixed;inset:0;display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
  .pantalla.activa{display:flex}

  .marca{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:20px;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.5rem;z-index:5}
  .estado{position:fixed;top:calc(env(safe-area-inset-top,0px) + 17px);right:20px;font-size:.8rem;opacity:.6;z-index:5}

  /* ---------- Inicio ---------- */
  #inicio{align-items:center;justify-content:center;gap:28px}
  .boton-grande{
    display:flex;flex-direction:column;align-items:center;gap:18px;width:min(88vw,460px);
    background:var(--amarillo);color:var(--verde);border:0;border-radius:12px;
    padding:clamp(28px,6vh,56px) 24px;cursor:pointer;box-shadow:0 12px 0 var(--verde2);
    animation:latido 2.2s ease-in-out infinite;
  }
  .boton-grande svg{width:clamp(80px,14vh,130px);height:auto}
  .boton-grande span{font-family:"Barlow Condensed",sans-serif;font-weight:800;
    font-size:clamp(2.8rem,8vh,4.6rem);line-height:.95;text-align:center}
  .boton-lista{
    width:min(88vw,460px);background:transparent;color:var(--papel);
    border:2px solid rgba(251,250,245,.45);border-radius:12px;padding:16px 20px;
    font-size:clamp(1.1rem,2.6vh,1.35rem);font-weight:600;cursor:pointer;
  }
  button:focus-visible,input:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
  @keyframes latido{50%{transform:scale(1.03)}}

  /* ---------- Cámara ---------- */
  #escaneo{align-items:center;justify-content:center;gap:22px;text-align:center}
  #camara{background:#000;border-radius:12px;overflow:hidden;width:min(92vw,58vh);aspect-ratio:3/4}
  #camara video{width:100%!important;height:100%!important;object-fit:cover}
  #escaneo p{margin:0;font-size:clamp(1.1rem,2.6vh,1.4rem)}
  .fila-cuenta{display:flex;align-items:center;gap:22px}
  .cuenta{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:clamp(2.6rem,7vh,4rem);
    color:var(--amarillo);line-height:1;min-width:2ch}
  .sec{background:var(--verde2);color:var(--papel);border:0;border-radius:8px;
    font-size:1.1rem;font-weight:600;padding:12px 24px;cursor:pointer}

  /* ---------- Resultado ---------- */
  #resultado{align-items:center;justify-content:center}
  .etiqueta{
    background:var(--papel);color:var(--tinta);border-radius:12px;width:min(92vw,560px);
    padding:clamp(24px,5vh,44px) 24px;text-align:center;
    box-shadow:0 14px 0 var(--amarillo);animation:entra .25s ease-out;
  }
  .etiqueta .nombre{margin:0 0 18px;font-weight:600;text-transform:uppercase;
    font-size:clamp(1.6rem,4.6vh,2.6rem);line-height:1.1;overflow-wrap:anywhere}
  .etiqueta .precio{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:var(--verde);
    font-size:clamp(4.5rem,24vw,10rem);line-height:.85;white-space:nowrap}
  .etiqueta .precio small{font-size:.4em;vertical-align:top;margin-right:6px}
  .etiqueta.error .precio{font-size:clamp(2rem,10vw,3.4rem);color:var(--rojo);white-space:normal}
  .barra{position:fixed;left:0;bottom:0;height:6px;background:var(--amarillo)}
  @keyframes entra{from{transform:scale(.96);opacity:0}}
  @keyframes baja{from{width:100%}to{width:0}}

  /* ---------- Lista sin código de barras ---------- */
  #lista{gap:12px}
  .cabeza{display:flex;align-items:center;gap:10px}
  .cabeza h2{margin:0;flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.8rem;line-height:1}
  .buscador{width:100%;border:0;border-radius:10px;padding:14px 16px;font:500 1.15rem "Barlow",sans-serif;
    background:var(--papel);color:var(--tinta);-webkit-user-select:text;user-select:text}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid rgba(251,250,245,.4);background:transparent;color:var(--papel);
    border-radius:999px;padding:8px 14px;font-size:.95rem;font-weight:600;cursor:pointer;text-transform:capitalize}
  .chip[aria-pressed="true"]{background:var(--amarillo);border-color:var(--amarillo);color:var(--verde)}
  .items{flex:1;overflow-y:auto;margin:0 -20px;padding:0 20px;-webkit-overflow-scrolling:touch}
  .item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;
    background:transparent;border:0;border-bottom:1px solid rgba(251,250,245,.14);color:var(--papel);
    padding:14px 2px;text-align:left;cursor:pointer}
  .item .cod{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:1.05rem;
    background:var(--verde3);border-radius:6px;padding:4px 8px;min-width:3.6em;text-align:center}
  .item .nom{font-size:1.05rem;font-weight:600;line-height:1.2;text-transform:uppercase}
  .item .pre{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.5rem;color:var(--amarillo);white-space:nowrap}
  .vacio{opacity:.7;text-align:center;padding:32px 0;font-size:1.1rem}

  @media (prefers-reduced-motion:reduce){.boton-grande,.etiqueta{animation:none}}
  #entrada{position:absolute;left:-9999px;opacity:0}
</style>
</head>
<body>
<div class="marca" id="marca">EDUMERCA</div>
<div class="estado" id="estado">Cargando precios…</div>

<section class="pantalla activa" id="inicio">
  <button class="boton-grande" id="btnEscanear">
    <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
      <path d="M4 4h14v5H9v9H4zM46 4h14v14h-5V9h-9zM4 46h5v9h9v5H4zM55 46h5v14H46v-5h9z"/>
      <rect x="15" y="16" width="3" height="32"/><rect x="21" y="16" width="6" height="32"/>
      <rect x="30" y="16" width="2" height="32"/><rect x="35" y="16" width="5" height="32"/>
      <rect x="43" y="16" width="2" height="32"/><rect x="47" y="16" width="3" height="32"/>
    </svg>
    <span>ESCANEA TU<br>PRODUCTO</span>
  </button>
  <button class="boton-lista" id="btnLista">Productos sin código de barras</button>
</section>

<section class="pantalla" id="escaneo">
  <div id="camara"></div>
  <p>Pon el código de barras frente a la cámara</p>
  <div class="fila-cuenta">
    <div class="cuenta" id="cuenta">30</div>
    <button class="sec" id="btnCancelar">Cancelar</button>
  </div>
</section>

<section class="pantalla" id="resultado"></section>

<section class="pantalla" id="lista">
  <div class="cabeza">
    <h2>Sin código de barras</h2>
    <button class="sec" id="btnVolver">Volver</button>
  </div>
  <input class="buscador" id="buscador" type="search" placeholder="Buscar por nombre o código" autocomplete="off" enterkeyhint="search">
  <div class="chips" id="chips"></div>
  <div class="items" id="items"></div>
</section>

<!-- Lector físico Bluetooth/USB, por si se conecta uno (no se ve) -->
<input id="entrada" inputmode="none" autocomplete="off" aria-hidden="true" tabindex="-1">

<script>
/* =========== CONFIGURACIÓN =========== */
const API_URL_DEFECTO = "https://script.google.com/macros/s/AKfycbz3szhpon8OQfnow67D7QhXtadcvl2X4Gm110wmroKCdeTYA_pCiFHr5NCEDnfI7WDy/exec";
const SEGUNDOS_CAMARA = 30;       // tiempo máximo con la cámara abierta
const SEGUNDOS_RESULTADO = 8;     // tiempo mostrando el precio
const SEGUNDOS_LISTA = 60;        // sin tocar nada, la lista vuelve al inicio
const MAX_DIGITOS_CORTO = 4;      // códigos de barras de hasta 4 dígitos (o vacíos) van a la lista
const MINUTOS_REFRESCO = 30;      // cada cuánto se recargan los precios
/* ===================================== */

const $ = id => document.getElementById(id);
const estado = $("estado"), entrada = $("entrada");
let catalogo = new Map(), sinCodigo = [], categoria = "";
let escaner = null, tCuenta = null, tResultado = null, tLista = null, ocupado = false;

const guardar=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const leer=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const pesos=n=>Number(n).toLocaleString("es-CO",{maximumFractionDigits:0});
const normal=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function ir(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.toggle("activa", p.id===id));
  if(id !== "lista") setTimeout(()=>entrada.focus({preventScroll:true}),50);
}

/* ---------- Precios ---------- */
function apiUrl(){
  const q = new URLSearchParams(location.search).get("api");
  if(q) guardar("api_url", q);
  const g = leer("api_url");
  return q || (g !== null ? g : API_URL_DEFECTO);
}
function cargarEnMapa(lista){
  catalogo = new Map(); sinCodigo = [];
  for(const it of lista){
    if(!it.nombre || it.precio === "" || isNaN(Number(it.precio))) continue;
    const item = {n:it.nombre, p:Number(it.precio), c:String(it.codigo||""), cat:it.categoria||""};
    const barras = String(it.barras||"").split(/[,;\s]+/).filter(Boolean);
    barras.forEach(b=>catalogo.set(b.replace(/^0+/,""), item));
    if(item.c) catalogo.set("#"+item.c, item);
    if(!barras.some(b=>b.length > MAX_DIGITOS_CORTO)) sinCodigo.push(item);
  }
  sinCodigo.sort((a,b)=>a.n.localeCompare(b.n,"es"));
  pintarChips();
  if($("lista").classList.contains("activa")) pintarLista();
}
async function descargarCatalogo(){
  const url = apiUrl();
  try{
    if(!url) throw new Error("sin URL");
    const r = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now());
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    if(!Array.isArray(d.productos) || !d.productos.length) throw new Error("vacío");
    cargarEnMapa(d.productos);
    guardar("catalogo", JSON.stringify(d.productos));
    guardar("catalogo_fecha", new Date().toISOString());
    estado.textContent = `${d.productos.length} productos`;
  }catch(e){
    const copia = leer("catalogo");
    if(copia){
      cargarEnMapa(JSON.parse(copia));
      estado.textContent = `Sin conexión · precios del ${new Date(leer("catalogo_fecha")).toLocaleDateString("es-CO")}`;
    }else estado.textContent = "No se pudieron cargar los precios";
  }
}
function buscar(c){
  c = String(c).trim();
  return catalogo.get(c.replace(/^0+/,"")) || catalogo.get("#"+c);
}

/* ---------- Cámara ---------- */
async function abrirCamara(){
  if(ocupado) return; ocupado = true;
  clearTimeout(tResultado);
  ir("escaneo");
  let quedan = SEGUNDOS_CAMARA;
  $("cuenta").textContent = quedan;
  tCuenta = setInterval(()=>{
    quedan--; $("cuenta").textContent = quedan;
    if(quedan <= 0) cerrarCamara().then(inicio);
  }, 1000);

  escaner = new Html5Qrcode("camara", {
    formatsToSupport:[
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128
    ],
    experimentalFeatures:{useBarCodeDetectorIfSupported:true}, verbose:false
  });
  try{
    await escaner.start({facingMode:"environment"},
      {fps:12, qrbox:(w,h)=>({width:Math.floor(w*.85), height:Math.floor(h*.3)})},
      async codigo=>{
        if(!escaner) return;
        if(navigator.vibrate) navigator.vibrate(80);
        await cerrarCamara();
        mostrar(codigo);
      }, ()=>{});
  }catch(err){
    await cerrarCamara();
    mostrarError("No se pudo abrir la cámara", "Revise el permiso de cámara del navegador");
  }
}
async function cerrarCamara(){
  clearInterval(tCuenta);
  const e = escaner; escaner = null;
  if(e){ try{ await e.stop(); }catch(x){} try{ e.clear(); }catch(x){} }
  ocupado = false;
}

/* ---------- Resultado ---------- */
function inicio(){ clearTimeout(tResultado); clearTimeout(tLista); ir("inicio"); }

function pintarEtiqueta(html, error, volverA){
  const div = document.createElement("div");
  div.className = "etiqueta" + (error ? " error" : "");
  div.innerHTML = html;
  const barra = document.createElement("div");
  barra.className = "barra";
  barra.style.animation = `baja ${SEGUNDOS_RESULTADO}s linear forwards`;
  $("resultado").replaceChildren(div, barra);
  $("resultado").dataset.volver = volverA || "inicio";
  ir("resultado");
  clearTimeout(tResultado);
  tResultado = setTimeout(volverDeResultado, SEGUNDOS_RESULTADO*1000);
  return div;
}
function volverDeResultado(){
  clearTimeout(tResultado);
  if($("resultado").dataset.volver === "lista") abrirLista(false); else inicio();
}
function mostrarItem(it, volverA){
  const div = pintarEtiqueta(`<p class="nombre"></p><div class="precio"><small>$</small>${pesos(it.p)}</div>`, false, volverA);
  div.querySelector(".nombre").textContent = it.n;
}
function mostrar(codigo){
  const it = buscar(codigo);
  if(!it) return mostrarError("Producto no encontrado", "Pregunte en caja");
  mostrarItem(it);
}
function mostrarError(titulo, texto){
  const div = pintarEtiqueta(`<p class="nombre"></p><div class="precio"></div>`, true);
  div.querySelector(".nombre").textContent = titulo;
  div.querySelector(".precio").textContent = texto;
}

/* ---------- Lista sin código de barras ---------- */
function pintarChips(){
  const cats = [...new Set(sinCodigo.map(i=>i.cat).filter(Boolean))].sort();
  if(categoria && !cats.includes(categoria)) categoria = "";
  $("chips").replaceChildren(...["", ...cats].map(c=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c ? c.toLowerCase() : "Todos";
    b.setAttribute("aria-pressed", c === categoria);
    b.onclick = ()=>{ categoria = c; pintarChips(); pintarLista(); tocarLista(); };
    return b;
  }));
}
function pintarLista(){
  const q = normal($("buscador").value.trim());
  const res = sinCodigo.filter(i =>
    (!categoria || i.cat === categoria) &&
    (!q || normal(i.n).includes(q) || i.c.includes(q)));
  const cont = $("items");
  if(!res.length){
    cont.innerHTML = `<div class="vacio">${sinCodigo.length ? "No hay productos con esa búsqueda" : "Cargando productos…"}</div>`;
    return;
  }
  cont.replaceChildren(...res.map(i=>{
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML = `<span class="cod"></span><span class="nom"></span><span class="pre">$${pesos(i.p)}</span>`;
    b.querySelector(".cod").textContent = i.c;
    b.querySelector(".nom").textContent = i.n;
    b.onclick = ()=>{ clearTimeout(tLista); mostrarItem(i, "lista"); };
    return b;
  }));
}
function abrirLista(limpiar = true){
  if(limpiar){ $("buscador").value = ""; categoria = ""; pintarChips(); }
  pintarLista();
  ir("lista");
  tocarLista();
}
function tocarLista(){
  clearTimeout(tLista);
  tLista = setTimeout(inicio, SEGUNDOS_LISTA*1000);
}

/* ---------- Eventos ---------- */
$("btnEscanear").addEventListener("click", abrirCamara);
$("btnLista").addEventListener("click", ()=>abrirLista());
$("btnVolver").addEventListener("click", inicio);
$("btnCancelar").addEventListener("click", ()=>cerrarCamara().then(inicio));
$("resultado").addEventListener("click", volverDeResultado);
$("buscador").addEventListener("input", ()=>{ pintarLista(); tocarLista(); });
$("items").addEventListener("scroll", tocarLista, {passive:true});

// Lector físico: escribe el código y envía Enter
entrada.addEventListener("keydown", async e=>{
  if(e.key !== "Enter") return;
  const v = entrada.value.trim(); entrada.value = "";
  if(!v) return;
  if(escaner) await cerrarCamara();
  mostrar(v);
});
setInterval(()=>{
  if(!$("lista").classList.contains("activa") && document.activeElement !== entrada)
    entrada.focus({preventScroll:true});
}, 1000);

// Configuración oculta: 5 toques en el logo
let toques = 0, tToques;
$("marca").addEventListener("click", ()=>{
  toques++; clearTimeout(tToques); tToques = setTimeout(()=>toques=0, 1500);
  if(toques >= 5){
    toques = 0;
    const u = prompt("URL de la web app de precios:", apiUrl());
    if(u !== null){ guardar("api_url", u.trim()); descargarCatalogo(); }
  }
});

// Si el celular se bloquea o cambia de app, apaga la cámara
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && escaner) cerrarCamara().then(inicio); });

/* ---------- App instalable ---------- */
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- Arranque ---------- */
descargarCatalogo();
setInterval(descargarCatalogo, MINUTOS_REFRESCO*60*1000);
</script>
</body>
</html>
