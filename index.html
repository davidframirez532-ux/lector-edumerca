<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<title>Edumerca · Consulte su precio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --verde:#0f3d2e; --verde2:#16573f; --verde3:#1f6b4f; --amarillo:#ffd23f;
    --papel:#fbfaf5; --tinta:#1b1b1b; --gris:#6b7069; --rojo:#c0392b; --azul:#2d8fd5;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{background:var(--verde);color:var(--papel);font-family:"Barlow",system-ui,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}
  .pantalla{position:fixed;inset:0;display:none;flex-direction:column;gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
  .pantalla.activa{display:flex}
  .marca{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:20px;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.5rem;z-index:5}
  .estado{position:fixed;top:calc(env(safe-area-inset-top,0px) + 17px);right:20px;font-size:.8rem;opacity:.6;z-index:5}

  .cabeza{display:flex;align-items:center;gap:10px;flex:none}
  .cabeza h2{margin:0;flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.8rem;line-height:1}
  .sec{background:var(--verde2);color:var(--papel);border:0;border-radius:8px;font-size:1.05rem;
    font-weight:600;padding:12px 20px;cursor:pointer}
  .sec.chico{padding:9px 14px;font-size:.95rem}
  .ppal{background:var(--amarillo);color:var(--verde);border:0;border-radius:12px;padding:16px;
    font-size:1.25rem;font-weight:600;cursor:pointer}
  .ghost{background:transparent;color:var(--papel);border:2px solid rgba(251,250,245,.45);
    border-radius:12px;padding:16px;font-size:1.15rem;font-weight:600;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}

  /* Inicio */
  #inicio{align-items:center;justify-content:center;gap:24px}
  .boton-grande{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(88vw,460px);
    background:var(--amarillo);color:var(--verde);border:0;border-radius:12px;
    padding:clamp(26px,5vh,52px) 24px;cursor:pointer;box-shadow:0 12px 0 var(--verde2);
    animation:latido 2.2s ease-in-out infinite}
  .boton-grande svg{width:clamp(76px,13vh,124px);height:auto}
  .boton-grande span{font-family:"Barlow Condensed",sans-serif;font-weight:800;
    font-size:clamp(2.6rem,7.5vh,4.4rem);line-height:.95;text-align:center}
  #btnInventario{width:min(88vw,460px)}
  @keyframes latido{50%{transform:scale(1.03)}}

  /* Cámara */
  #escaneo{align-items:center;justify-content:center;text-align:center}
  #camara{background:#000;border-radius:12px;overflow:hidden;width:min(92vw,54vh);aspect-ratio:3/4}
  #camara video{width:100%!important;height:100%!important;object-fit:cover}
  #escaneo p{margin:0;font-size:1.1rem}
  .fila{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
  .cuenta{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.6rem;color:var(--amarillo);min-width:2ch}

  /* Resultado */
  #resultado{align-items:center;justify-content:center}
  .etiqueta{background:var(--papel);color:var(--tinta);border-radius:12px;width:min(92vw,560px);
    padding:clamp(22px,4.5vh,40px) 24px;text-align:center;box-shadow:0 14px 0 var(--amarillo);
    animation:entra .25s ease-out}
  .etiqueta .nombre{margin:0 0 16px;font-weight:600;text-transform:uppercase;
    font-size:clamp(1.5rem,4.4vh,2.4rem);line-height:1.1;overflow-wrap:anywhere}
  .etiqueta .precio{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:var(--verde);
    font-size:clamp(4rem,22vw,9rem);line-height:.85;white-space:nowrap}
  .etiqueta .precio small{font-size:.4em;vertical-align:top;margin-right:6px}
  .etiqueta .cant{margin:14px 0 0;font-size:1.15rem;color:var(--gris)}
  .etiqueta .cant b{color:var(--tinta);font-size:1.5rem}
  .etiqueta .cod-chico{margin:12px 0 0;font-size:.85rem;color:var(--gris);letter-spacing:.04em}
  .etiqueta.error .precio{font-size:clamp(2rem,9vw,3rem);color:var(--rojo);white-space:normal}
  .etiqueta.error .cod-grande{margin:16px 0 0;font-family:"Barlow Condensed",sans-serif;font-weight:800;
    font-size:clamp(1.8rem,8vw,2.6rem);color:var(--tinta);letter-spacing:.05em;overflow-wrap:anywhere}
  .barra{position:fixed;left:0;bottom:0;height:6px;background:var(--amarillo)}
  @keyframes entra{from{transform:scale(.96);opacity:0}}
  @keyframes baja{from{width:100%}to{width:0}}

  /* Listas */
  .buscador{width:100%;border:0;border-radius:10px;padding:14px 16px;font:500 1.15rem "Barlow",sans-serif;
    background:var(--papel);color:var(--tinta);-webkit-user-select:text;user-select:text;flex:none}
  .codigo-manual{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:2.2rem;
    letter-spacing:.04em;text-align:center}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid rgba(251,250,245,.4);background:transparent;color:var(--papel);
    border-radius:999px;padding:8px 14px;font-size:.95rem;font-weight:600;cursor:pointer;text-transform:capitalize}
  .chip[aria-pressed="true"]{background:var(--amarillo);border-color:var(--amarillo);color:var(--verde)}
  .items{flex:1;overflow-y:auto;margin:0 -20px;padding:0 20px;-webkit-overflow-scrolling:touch}
  .item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;
    background:transparent;border:0;border-bottom:1px solid rgba(251,250,245,.14);color:var(--papel);
    padding:13px 2px;text-align:left;cursor:pointer}
  .item .cod{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:1rem;
    background:var(--verde3);border-radius:6px;padding:4px 7px;min-width:3.4em;text-align:center}
  .item .nom{font-size:1.02rem;font-weight:600;line-height:1.2;text-transform:uppercase}
  .item .nom small{display:block;font-size:.82rem;font-weight:500;opacity:.65;text-transform:none}
  .item .pre{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.45rem;
    color:var(--amarillo);white-space:nowrap;text-align:right}
  .item .pre small{display:block;font-family:"Barlow",sans-serif;font-weight:600;font-size:.8rem;color:var(--papel);opacity:.7}
  .item .pre .mas{color:var(--azul)} .item .pre .menos{color:var(--rojo)}
  .vacio{opacity:.7;text-align:center;padding:30px 10px;font-size:1.05rem;line-height:1.5}
  .menu{display:flex;flex-direction:column;gap:14px;justify-content:center;flex:1}

  /* Conteo */
  .resumen{display:flex;gap:10px;flex:none}
  .caja{flex:1;background:var(--verde2);border-radius:10px;padding:10px;text-align:center}
  .caja b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.7rem;line-height:1}
  .caja span{font-size:.78rem;opacity:.8}
  #conteoItem{justify-content:center;gap:16px}
  .ficha{background:var(--papel);color:var(--tinta);border-radius:12px;padding:20px;text-align:center}
  .ficha h3{margin:0 0 6px;font-size:1.3rem;text-transform:uppercase;line-height:1.15}
  .ficha .meta{color:var(--gris);font-size:.9rem}
  .ficha .siigo{margin-top:12px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:3.2rem;
    color:var(--verde);line-height:1}
  .ficha .siigo span{display:block;font-family:"Barlow",sans-serif;font-size:.85rem;font-weight:600;color:var(--gris)}
  .acciones{display:flex;gap:10px;flex-wrap:wrap}
  .acciones>*{flex:1}
  @media (prefers-reduced-motion:reduce){.boton-grande,.etiqueta{animation:none}}
  #entrada{position:absolute;left:-9999px;opacity:0}
</style>
</head>
<body>
<div class="marca" id="marca">EDUMERCA</div>
<div class="estado" id="estado">Cargando precios…</div>

<!-- ============ INICIO ============ -->
<section class="pantalla activa" id="inicio">
  <button class="boton-grande" id="btnEscanear">
    <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
      <path d="M4 4h14v5H9v9H4zM46 4h14v14h-5V9h-9zM4 46h5v9h9v5H4zM55 46h5v14H46v-5h9z"/>
      <rect x="15" y="16" width="3" height="32"/><rect x="21" y="16" width="6" height="32"/>
      <rect x="30" y="16" width="2" height="32"/><rect x="35" y="16" width="5" height="32"/>
      <rect x="43" y="16" width="2" height="32"/><rect x="47" y="16" width="3" height="32"/>
    </svg>
    <span>ESCANEA TU<br>PRODUCTO</span>
  </button>
  <button class="ghost" id="btnInventario">ENTRA AL INVENTARIO</button>
</section>

<!-- ============ CÁMARA ============ -->
<section class="pantalla" id="escaneo">
  <div class="cabeza"><h2 id="tituloEscaneo">Escanea el producto</h2></div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <div id="camara"></div>
    <p>Pon el código de barras frente a la cámara</p>
    <div class="fila">
      <div class="cuenta" id="cuenta">30</div>
      <button class="sec" id="btnDigitarEsc">Digitar código</button>
      <button class="sec" id="btnCancelar">Cancelar</button>
    </div>
  </div>
</section>

<!-- ============ RESULTADO ============ -->
<section class="pantalla" id="resultado"></section>

<!-- ============ MENÚ INVENTARIO ============ -->
<section class="pantalla" id="inventario">
  <div class="cabeza"><h2>Inventario</h2><button class="sec" id="btnSalirInv">Salir</button></div>
  <div class="menu">
    <button class="ppal" id="btnCatalogo">Catálogo completo</button>
    <button class="ghost" id="btnConteo">Conteo físico</button>
  </div>
</section>

<!-- ============ LISTA (catálogo / sin código) ============ -->
<section class="pantalla" id="lista">
  <div class="cabeza"><h2 id="tituloLista">Catálogo</h2><button class="sec" id="btnVolverLista">Volver</button></div>
  <input class="buscador" id="buscador" type="search" placeholder="Buscar por nombre o código" autocomplete="off" enterkeyhint="search">
  <div class="chips" id="chips"></div>
  <div class="items" id="items"></div>
</section>

<!-- ============ AJUSTES (5 toques en el logo) ============ -->
<section class="pantalla" id="ajustes">
  <div class="cabeza"><h2>Ajustes</h2><button class="sec" id="btnCerrarAjustes">Cerrar</button></div>
  <div class="menu">
    <button class="ppal" id="btnActualizarSiigo">Actualizar inventario desde Siigo</button>
    <p id="msgAjustes" style="margin:0;text-align:center;opacity:.8;min-height:1.4em"></p>
    <button class="ghost" id="btnCambiarUrl">Cambiar URL de Apps Script</button>
    <p id="verApp" style="margin:0;text-align:center;opacity:.55;font-size:.9rem"></p>
    <button class="sec" id="btnForzar">Forzar actualización de la app</button>
  </div>
</section>

<!-- ============ CONTEO FÍSICO ============ -->
<section class="pantalla" id="conteo">
  <div class="cabeza"><h2>Conteo físico</h2><button class="sec" id="btnVolverConteo">Volver</button></div>
  <div class="resumen">
    <div class="caja"><b id="cnTotal">0</b><span>contados</span></div>
    <div class="caja"><b id="cnDif">0</b><span>con diferencia</span></div>
  </div>
  <div class="acciones">
    <button class="ppal" id="btnConteoEscanear">Escanear</button>
    <button class="sec" id="btnConteoDigitar">Digitar</button>
  </div>
  <div class="items" id="conteoItems"></div>
  <div class="acciones">
    <button class="sec chico" id="btnConteoCompartir">Compartir CSV</button>
    <button class="sec chico" id="btnConteoTxt">Compartir TXT</button>
    <button class="sec chico" id="btnConteoExportar">Descargar</button>
    <button class="sec chico" id="btnConteoDrive">Guardar en Drive</button>
    <button class="sec chico" id="btnConteoBorrar">Borrar todo</button>
  </div>
</section>

<!-- ============ INGRESAR CANTIDAD ============ -->
<section class="pantalla" id="conteoItem">
  <div class="cabeza"><h2>Cantidad contada</h2><button class="sec" id="btnCancelarItem">Cancelar</button></div>
  <div class="ficha" id="fichaConteo"></div>
  <input class="buscador codigo-manual" id="cantidadReal" type="text" inputmode="decimal"
    placeholder="0" autocomplete="off" enterkeyhint="done">
  <button class="ppal" id="btnGuardarConteo">Guardar y escanear otro</button>
  <button class="sec" id="btnGuardarCerrar">Guardar y terminar</button>
</section>

<input id="entrada" inputmode="none" autocomplete="off" aria-hidden="true" tabindex="-1">

<script>
/* =========== CONFIGURACIÓN =========== */
const VERSION = "v10 · 30-sep-2026";
const API_URL_DEFECTO = "https://script.google.com/macros/s/AKfycbxnBOgTuGFoBMlwOB4EfVHTS6g_V5Y-nFKr2UiBntSDdeI1O8-3wT37j7BNZixV8nub/exec";
const SEGUNDOS_CAMARA = 30;
const SEGUNDOS_RESULTADO = 8;
const SEGUNDOS_LISTA = 90;
const MAX_DIGITOS_CORTO = 5;
const MINUTOS_REFRESCO = 30;
/* ===================================== */

const $ = id => document.getElementById(id);
const estado = $("estado"), entrada = $("entrada");
let catalogo = new Map(), productos = [], sinCodigo = new Set(), categoria = "", soloSinCodigo = false;
let escaner = null, modoCamara = "precio", pendiente = null;
let tCuenta = null, tResultado = null, tLista = null, ocupado = false;
let conteo = [];

const guardar=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const leer=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const pesos=n=>Number(n).toLocaleString("es-CO",{maximumFractionDigits:0});
const num=n=>Number(n).toLocaleString("es-CO",{maximumFractionDigits:2});
const normal=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function ir(id){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.toggle("activa", p.id===id));
  const escribible = ["lista","conteoItem","ajustes"].includes(id);
  if(!escribible) setTimeout(()=>entrada.focus({preventScroll:true}),50);
}

/* ---------- Precios ---------- */
function apiUrl(){
  const q = new URLSearchParams(location.search).get("api");
  if(q) guardar("api_url", q);
  const g = leer("api_url");
  return q || (g !== null ? g : API_URL_DEFECTO);
}
function cargarEnMapa(lista){
  catalogo = new Map(); productos = []; sinCodigo = new Set();
  for(const it of lista){
    if(!it.nombre || it.precio === "" || isNaN(Number(it.precio))) continue;
    const barras = String(it.barras||"").split(/[,;\s]+/).filter(Boolean);
    const item = {n:it.nombre, p:Number(it.precio), c:String(it.codigo||""), cat:it.categoria||"",
                  q:(it.cantidad === null || it.cantidad === undefined) ? null : Number(it.cantidad),
                  b:barras[0] || String(it.codigo||"")};
    barras.forEach(b=>catalogo.set(b.replace(/^0+/,""), item));
    if(item.c) catalogo.set("#"+item.c, item);
    productos.push(item);
    const cortos = barras.length ? barras : [item.c];
    if(cortos.length && cortos.every(b=>b && b.length <= MAX_DIGITOS_CORTO)) sinCodigo.add(item);
  }
  productos.sort((a,b)=>a.n.localeCompare(b.n,"es"));
  if($("lista").classList.contains("activa")){ pintarChips(); pintarLista(); }
}
async function pedirPrecios(url){
  let ultimoError;
  for(let intento = 1; intento <= 3; intento++){
    const ctrl = new AbortController();
    const tt = setTimeout(()=>ctrl.abort(), 25000);
    try{
      const r = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now(), {signal:ctrl.signal});
      clearTimeout(tt);
      if(!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){ clearTimeout(tt); ultimoError = e; await new Promise(ok=>setTimeout(ok, intento*4000)); }
  }
  throw ultimoError;
}
let descargando = false;
async function descargarCatalogo(){
  if(descargando) return; descargando = true;
  const url = apiUrl();
  try{
    if(!url) throw new Error("sin URL");
    const d = await pedirPrecios(url);
    if(d.error) throw new Error(d.error);
    if(!Array.isArray(d.productos) || !d.productos.length) throw new Error("vacío");
    cargarEnMapa(d.productos);
    guardar("catalogo", JSON.stringify(d.productos));
    guardar("catalogo_fecha", new Date().toISOString());
    estado.textContent = `${d.productos.length} productos`;
  }catch(e){
    console.warn("No se pudieron actualizar los precios:", e);
    const copia = leer("catalogo");
    if(copia){
      if(!catalogo.size) cargarEnMapa(JSON.parse(copia));
      const f = new Date(leer("catalogo_fecha"));
      estado.textContent = f.toDateString() === new Date().toDateString()
        ? `Precios de las ${f.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"})}`
        : `Sin conexión · precios del ${f.toLocaleDateString("es-CO")}`;
    }else estado.textContent = "No se pudieron cargar los precios";
    setTimeout(descargarCatalogo, 2*60*1000);
  }finally{ descargando = false; }
}
function buscar(c){
  c = String(c).trim();
  return catalogo.get(c.replace(/^0+/,"")) || catalogo.get("#"+c) || catalogo.get("#"+c.replace(/^0+/,""));
}

/* ---------- Cámara ---------- */
async function abrirCamara(modo){
  if(ocupado) return; ocupado = true;
  modoCamara = modo || "precio";
  clearTimeout(tResultado); clearTimeout(tLista);
  $("tituloEscaneo").textContent = modoCamara === "conteo" ? "Conteo · escanea el producto" : "Escanea el producto";
  $("btnDigitarEsc").hidden = modoCamara !== "conteo";
  ir("escaneo");
  let quedan = SEGUNDOS_CAMARA;
  $("cuenta").textContent = quedan;
  tCuenta = setInterval(()=>{
    quedan--; $("cuenta").textContent = quedan;
    if(quedan <= 0) cerrarCamara().then(()=> modoCamara === "conteo" ? abrirConteo() : inicio());
  }, 1000);
  escaner = new Html5Qrcode("camara", {
    formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.CODE_128],
    experimentalFeatures:{useBarCodeDetectorIfSupported:true}, verbose:false
  });
  try{
    await escaner.start({facingMode:"environment"},
      {fps:12, qrbox:(w,h)=>({width:Math.floor(w*.85), height:Math.floor(h*.3)})},
      async codigo=>{
        if(!escaner) return;
        if(navigator.vibrate) navigator.vibrate(80);
        const m = modoCamara;
        await cerrarCamara();
        if(m === "conteo") pedirCantidad(codigo); else mostrar(codigo);
      }, ()=>{});
  }catch(err){
    await cerrarCamara();
    mostrarError("No se pudo abrir la cámara", "Revise el permiso de cámara del navegador");
  }
}
async function cerrarCamara(){
  clearInterval(tCuenta);
  const e = escaner; escaner = null;
  if(e){ try{ await e.stop(); }catch(x){} try{ e.clear(); }catch(x){} }
  ocupado = false;
}

/* ---------- Resultado ---------- */
function inicio(){ clearTimeout(tResultado); clearTimeout(tLista); ir("inicio"); }
function pintarEtiqueta(html, error, volverA){
  const div = document.createElement("div");
  div.className = "etiqueta" + (error ? " error" : "");
  div.innerHTML = html;
  const barra = document.createElement("div");
  barra.className = "barra";
  barra.style.animation = `baja ${SEGUNDOS_RESULTADO}s linear forwards`;
  $("resultado").replaceChildren(div, barra);
  $("resultado").dataset.volver = volverA || "inicio";
  ir("resultado");
  clearTimeout(tResultado);
  tResultado = setTimeout(volverDeResultado, SEGUNDOS_RESULTADO*1000);
  return div;
}
function volverDeResultado(){
  clearTimeout(tResultado);
  const v = $("resultado").dataset.volver;
  if(v === "lista") abrirLista(false);
  else inicio();
}
function mostrarItem(it, volverA, codigoUsado){
  const div = pintarEtiqueta(
    `<p class="nombre"></p><div class="precio"><small>$</small>${pesos(it.p)}</div>` +
    (it.q !== null ? `<p class="cant">En Siigo: <b>${num(it.q)}</b></p>` : "") +
    `<p class="cod-chico"></p>`, false, volverA);
  div.querySelector(".nombre").textContent = it.n;
  div.querySelector(".cod-chico").textContent = "Código " + (codigoUsado || it.b || it.c);
}
function mostrar(codigo, volverA){
  const it = buscar(codigo);
  if(!it) return mostrarNoEncontrado(codigo, volverA);
  mostrarItem(it, volverA, String(codigo).trim());
}
function mostrarNoEncontrado(codigo, volverA){
  const div = pintarEtiqueta(
    `<p class="nombre">Producto no encontrado</p><div class="precio">Pregunte en caja</div>
     <p class="cod-grande"></p>`, true, volverA);
  div.querySelector(".cod-grande").textContent = String(codigo).trim();
}
function mostrarError(titulo, texto, volverA){
  const div = pintarEtiqueta(`<p class="nombre"></p><div class="precio"></div>`, true, volverA);
  div.querySelector(".nombre").textContent = titulo;
  div.querySelector(".precio").textContent = texto;
}

/* ---------- Listas ---------- */
function fuente(){ return soloSinCodigo ? productos.filter(i=>sinCodigo.has(i)) : productos; }
function pintarChips(){
  const cats = [...new Set(productos.map(i=>i.cat).filter(Boolean))].sort();
  if(categoria && !cats.includes(categoria)) categoria = "";
  const sin = document.createElement("button");
  sin.className = "chip"; sin.textContent = "Sin código de barras";
  sin.setAttribute("aria-pressed", soloSinCodigo);
  sin.onclick = ()=>{ soloSinCodigo = !soloSinCodigo; pintarChips(); pintarLista(); tocarLista(); };
  $("chips").replaceChildren(sin, ...["", ...cats].map(c=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c ? c.toLowerCase() : "Todas";
    b.setAttribute("aria-pressed", c === categoria);
    b.onclick = ()=>{ categoria = c; pintarChips(); pintarLista(); tocarLista(); };
    return b;
  }));
}
function pintarLista(){
  const q = normal($("buscador").value.trim());
  const res = fuente().filter(i =>
    (!categoria || i.cat === categoria) &&
    (!q || normal(i.n).includes(q) || i.c.includes(q) || i.b.includes(q))).slice(0, 400);
  const cont = $("items");
  if(!res.length){
    cont.innerHTML = `<div class="vacio">${fuente().length ? "No hay productos con esa búsqueda" : "Cargando productos…"}</div>`;
    return;
  }
  cont.replaceChildren(...res.map(i=>{
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML = `<span class="cod"></span><span class="nom"></span><span class="pre">$${pesos(i.p)}</span>`;
    b.querySelector(".cod").textContent = i.c || i.b;
    b.querySelector(".nom").textContent = i.n;
    b.onclick = ()=>{ clearTimeout(tLista); mostrarItem(i, "lista"); };
    return b;
  }));
}
function abrirLista(limpiar = true){
  $("tituloLista").textContent = "Catálogo completo";
  if(limpiar){ $("buscador").value = ""; categoria = ""; soloSinCodigo = false; }
  pintarChips(); pintarLista(); ir("lista"); tocarLista();
}
function tocarLista(){ clearTimeout(tLista); tLista = setTimeout(inicio, SEGUNDOS_LISTA*1000); }

/* ---------- Conteo físico ---------- */
function cargarConteo(){
  try{ conteo = JSON.parse(leer("conteo") || "[]"); }catch(e){ conteo = []; }
}
function guardarConteo(){ guardar("conteo", JSON.stringify(conteo)); }
function abrirConteo(){ clearTimeout(tLista); pintarConteo(); ir("conteo"); }
function pintarConteo(){
  $("cnTotal").textContent = conteo.length;
  $("cnDif").textContent = conteo.filter(c=>c.siigo !== null && c.real !== c.siigo).length;
  const cont = $("conteoItems");
  if(!conteo.length){
    cont.innerHTML = `<div class="vacio">Aún no has contado nada.<br>Toca Escanear y digita la cantidad real de cada producto.</div>`;
    return;
  }
  cont.replaceChildren(...[...conteo].reverse().map(c=>{
    const dif = c.siigo === null ? null : c.real - c.siigo;
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML = `<span class="cod"></span>
      <span class="nom"><span class="t"></span><small></small></span>
      <span class="pre"></span>`;
    b.querySelector(".cod").textContent = c.codigo;
    b.querySelector(".t").textContent = c.nombre;
    b.querySelector("small").textContent =
      `Siigo ${c.siigo === null ? "?" : num(c.siigo)} · contado ${num(c.real)}`;
    const pre = b.querySelector(".pre");
    pre.innerHTML = dif === null ? "—"
      : `<span class="${dif > 0 ? "mas" : dif < 0 ? "menos" : ""}">${dif > 0 ? "+" : ""}${num(dif)}</span><small>dif.</small>`;
    b.onclick = ()=>{ if(confirm(`¿Borrar el conteo de ${c.nombre}?`)){ conteo = conteo.filter(x=>x!==c); guardarConteo(); pintarConteo(); } };
    return b;
  }));
}
function pedirCantidad(codigo){
  const cod = String(codigo).trim();
  const it = buscar(cod);
  pendiente = {codigo: cod, nombre: it ? it.n : "PRODUCTO NO REGISTRADO", precio: it ? it.p : "",
               siigo: it && it.q !== null ? it.q : null};
  const previo = conteo.find(c=>c.codigo === cod);
  $("fichaConteo").innerHTML =
    `<h3></h3><div class="meta"></div>
     <div class="siigo">${pendiente.siigo === null ? "?" : num(pendiente.siigo)}<span>cantidad en Siigo</span></div>` +
    (previo ? `<div class="meta" style="margin-top:10px">Ya contado: ${num(previo.real)} · se reemplaza</div>` : "");
  $("fichaConteo").querySelector("h3").textContent = pendiente.nombre;
  $("fichaConteo").querySelector(".meta").textContent =
    "Código " + cod + (pendiente.precio !== "" ? " · $" + pesos(pendiente.precio) : "");
  $("cantidadReal").value = "";
  ir("conteoItem");
  setTimeout(()=>$("cantidadReal").focus(), 100);
}
function guardarItemConteo(){
  const v = $("cantidadReal").value.replace(",",".").trim();
  if(v === "" || isNaN(Number(v))){ $("cantidadReal").focus(); return false; }
  conteo = conteo.filter(c=>c.codigo !== pendiente.codigo);
  conteo.push({...pendiente, real: Number(v), hora: new Date().toISOString()});
  guardarConteo();
  $("cantidadReal").blur();
  return true;
}
function csvConteo(){
  const cab = "CODIGO,DESCRIPCION,PRECIO,CTD_SIIGO,CTD_REAL,DIFERENCIA,FECHA";
  const esc = t => `"${String(t).replace(/"/g,'""')}"`;
  const filas = conteo.map(c=>[
    esc(c.codigo), esc(c.nombre), c.precio, c.siigo === null ? "" : c.siigo, c.real,
    c.siigo === null ? "" : (c.real - c.siigo), esc(new Date(c.hora).toLocaleString("es-CO"))
  ].join(","));
  return "\uFEFF" + [cab, ...filas].join("\r\n");
}
function descargarConteo(){
  if(!conteo.length) return alert("No hay nada contado todavía.");
  const b = new Blob([csvConteo()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `conteo_${new Date().toISOString().slice(0,16).replace(/[:T]/g,"")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function txtConteo(){
  const f = new Date().toLocaleString("es-CO");
  const dif = conteo.filter(c=>c.siigo !== null && c.real !== c.siigo);
  const lin = [];
  lin.push("CONTEO FISICO - EDUMERCA");
  lin.push(f);
  lin.push("Contados: " + conteo.length + "   Con diferencia: " + dif.length);
  lin.push("");
  const bloque = (titulo, lista) => {
    if(!lista.length) return;
    lin.push(titulo);
    lin.push("-".repeat(34));
    lista.forEach(c=>{
      const d = c.siigo === null ? null : c.real - c.siigo;
      lin.push(c.nombre);
      lin.push("  cod " + c.codigo + "   $" + pesos(c.precio || 0));
      lin.push("  Siigo " + (c.siigo === null ? "?" : num(c.siigo)) +
               "  |  contado " + num(c.real) +
               "  |  dif " + (d === null ? "?" : (d > 0 ? "+" : "") + num(d)));
      lin.push("");
    });
  };
  bloque("CON DIFERENCIA", dif);
  bloque("SIN DIFERENCIA", conteo.filter(c=>!dif.includes(c)));
  return lin.join("\n");
}
async function compartirArchivo(contenido, nombre, tipo){
  const archivo = new File([contenido], nombre, {type:tipo});
  if(navigator.canShare && navigator.canShare({files:[archivo]})){
    try{ await navigator.share({files:[archivo], title:"Conteo físico Edumerca"}); return true; }
    catch(e){ if(e.name === "AbortError") return true; }
  }
  return false;
}
async function compartirTxt(){
  if(!conteo.length) return alert("No hay nada contado todavía.");
  const nombre = `conteo_${new Date().toISOString().slice(0,16).replace(/[:T]/g,"")}.txt`;
  if(await compartirArchivo(txtConteo(), nombre, "text/plain")) return;
  // Si no se puede compartir archivo, se manda como texto suelto
  try{ await navigator.share({title:"Conteo físico Edumerca", text: txtConteo()}); }
  catch(e){ if(e.name !== "AbortError") alert("Este celular no permite compartir desde la app."); }
}
async function compartirConteo(){
  if(!conteo.length) return alert("No hay nada contado todavía.");
  const nombre = `conteo_${new Date().toISOString().slice(0,16).replace(/[:T]/g,"")}.csv`;
  const archivo = new File([csvConteo()], nombre, {type:"text/csv"});
  if(navigator.canShare && navigator.canShare({files:[archivo]})){
    try{
      await navigator.share({files:[archivo], title:"Conteo físico Edumerca"});
      return;
    }catch(e){ if(e.name === "AbortError") return; }
  }
  alert("Este celular no deja compartir archivos directamente; se descargará.");
  descargarConteo();
}
async function enviarConteo(){
  if(!conteo.length) return alert("No hay nada contado todavía.");
  const url = apiUrl();
  if(!url) return alert("Falta configurar la URL de Apps Script.");
  const btn = $("btnConteoDrive"); btn.disabled = true; btn.textContent = "Guardando…";
  try{
    const r = await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({sesion: new Date().toLocaleString("es-CO"), conteo})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || "error");
    if(confirm(`Se guardaron ${d.guardadas} líneas en Drive.\n\n¿Borrar el conteo del celular?`)){
      conteo = []; guardarConteo(); pintarConteo();
    }
  }catch(e){
    alert("No se pudo guardar en Drive: " + e.message + "\nDescarga el CSV para no perder el conteo.");
  }finally{ btn.disabled = false; btn.textContent = "Guardar en Drive"; }
}

/* ---------- Eventos ---------- */
$("btnEscanear").addEventListener("click", ()=>abrirCamara("precio"));
$("btnInventario").addEventListener("click", ()=>{ clearTimeout(tLista); ir("inventario"); tocarLista(); });
$("btnSalirInv").addEventListener("click", inicio);
$("btnCatalogo").addEventListener("click", ()=>abrirLista());
$("btnConteo").addEventListener("click", abrirConteo);
$("btnVolverLista").addEventListener("click", ()=>{ clearTimeout(tLista); ir("inventario"); tocarLista(); });
$("buscador").addEventListener("input", ()=>{ pintarLista(); tocarLista(); });
$("items").addEventListener("scroll", tocarLista, {passive:true});
$("resultado").addEventListener("click", volverDeResultado);
$("btnCancelar").addEventListener("click", ()=>cerrarCamara().then(()=> modoCamara === "conteo" ? abrirConteo() : inicio()));
$("btnDigitarEsc").addEventListener("click", async ()=>{
  await cerrarCamara();
  const v = prompt("Código del producto:");
  if(v && v.trim()) pedirCantidad(v.trim()); else abrirConteo();
});
$("btnVolverConteo").addEventListener("click", ()=>{ clearTimeout(tLista); ir("inventario"); tocarLista(); });
$("btnConteoEscanear").addEventListener("click", ()=>abrirCamara("conteo"));
$("btnConteoDigitar").addEventListener("click", ()=>{
  const v = prompt("Código del producto:");
  if(v && v.trim()) pedirCantidad(v.trim());
});
$("btnConteoCompartir").addEventListener("click", compartirConteo);
$("btnConteoTxt").addEventListener("click", compartirTxt);
$("btnConteoExportar").addEventListener("click", descargarConteo);
$("btnConteoDrive").addEventListener("click", enviarConteo);
$("btnConteoBorrar").addEventListener("click", ()=>{
  if(conteo.length && confirm(`¿Borrar los ${conteo.length} productos contados?`)){
    conteo = []; guardarConteo(); pintarConteo();
  }
});
$("btnGuardarConteo").addEventListener("click", ()=>{ if(guardarItemConteo()) abrirCamara("conteo"); });
$("btnGuardarCerrar").addEventListener("click", ()=>{ if(guardarItemConteo()) abrirConteo(); });
$("btnCancelarItem").addEventListener("click", abrirConteo);
$("cantidadReal").addEventListener("keydown", e=>{
  if(e.key === "Enter"){ e.preventDefault(); if(guardarItemConteo()) abrirCamara("conteo"); }
});

// Lector físico Bluetooth/USB
entrada.addEventListener("keydown", async e=>{
  if(e.key !== "Enter") return;
  const v = entrada.value.trim(); entrada.value = "";
  if(!v) return;
  const enConteo = modoCamara === "conteo" && (escaner || $("conteo").classList.contains("activa"));
  if(escaner) await cerrarCamara();
  if(enConteo) pedirCantidad(v); else mostrar(v);
});
setInterval(()=>{
  const act = document.querySelector(".pantalla.activa");
  if(act && !["lista","conteoItem","ajustes"].includes(act.id) && document.activeElement !== entrada)
    entrada.focus({preventScroll:true});
}, 1000);

/* ---------- Ajustes (5 toques en el logo) ---------- */
let toques = 0, tToques;
$("marca").addEventListener("click", async ()=>{
  toques++; clearTimeout(tToques); tToques = setTimeout(()=>toques=0, 1500);
  if(toques >= 5){
    toques = 0;
    if(escaner) await cerrarCamara();
    clearTimeout(tResultado); clearTimeout(tLista);
    $("msgAjustes").textContent = "";
    ir("ajustes");
  }
});
$("verApp").textContent = "Versión " + VERSION;
$("btnCerrarAjustes").addEventListener("click", inicio);
$("btnForzar").addEventListener("click", async ()=>{
  $("msgAjustes").textContent = "Buscando versión nueva…";
  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const ks = await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.reload(true);
});
$("btnCambiarUrl").addEventListener("click", ()=>{
  const u = prompt("URL de la web app de precios:", apiUrl());
  if(u !== null){ guardar("api_url", u.trim()); descargarCatalogo(); }
});
$("btnActualizarSiigo").addEventListener("click", async ()=>{
  const url = apiUrl();
  if(!url) return alert("Falta configurar la URL de Apps Script.");
  const btn = $("btnActualizarSiigo"), msg = $("msgAjustes");
  btn.disabled = true;
  const t0 = Date.now();
  const reloj = setInterval(()=>{
    const s = Math.round((Date.now()-t0)/1000);
    btn.textContent = `Actualizando… ${s}s`;
  }, 1000);
  btn.textContent = "Actualizando… 0s";
  msg.textContent = "Trae el inventario de Siigo. Puede tardar 1 a 3 minutos, no cierres la app.";
  try{
    const r = await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({accion:"actualizar"})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || "error");
    await descargarCatalogo();
    msg.textContent = `Listo · ${productos.length} productos actualizados`;
  }catch(e){
    msg.textContent = "No se pudo actualizar: " + e.message;
  }finally{
    clearInterval(reloj);
    btn.disabled = false; btn.textContent = "Actualizar inventario desde Siigo";
  }
});
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden && escaner) cerrarCamara().then(inicio);
  if(!document.hidden && Date.now() - new Date(leer("catalogo_fecha")||0) > 10*60*1000) descargarCatalogo();
});
window.addEventListener("online", descargarCatalogo);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- Arranque ---------- */
cargarConteo();
try{ const c = leer("catalogo"); if(c) cargarEnMapa(JSON.parse(c)); }catch(e){}
descargarCatalogo();
setInterval(descargarCatalogo, MINUTOS_REFRESCO*60*1000);
</script>
